[workspace]
resolver = "2"
members = [
    "crates/parking-domain",
    "crates/parking-events",
    "crates/parking-search",
    "crates/parking-persistence",
    "crates/google-maps-adapter",
    "crates/parking-perception",
    "services/parking-ingestion-worker",
    "services/parking-api",
    "services/parking-edge-agent",
    "tools/camera-simulator",
    "tools/perception-evaluator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
async-nats = { version = "0.50", features = ["jetstream"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
geo = "0.32"
gstreamer = "=0.25.0"
gstreamer-app = "=0.25.0"
gstreamer-video = "=0.25.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = "1"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
