apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: parking-pilot
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: workerImage
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilites:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: NATS_URL
            value: "nats://nats:4222" 
          - name: LOG_FORMAT
            value: "json"
          - name: RUST_LOG
            value: "info"
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3

