apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: parking-pilot
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: workerImage
        resources:
          limits:
            memory: 128Mi
            cpu: 500m
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: parking-database
                key: DATABASE_URL
          - name: NATS_URL
            value: "nats://nats:4222" 
          - name: LOG_FORMAT
            value: "json"
          - name: RUST_LOG
            value: "info"

